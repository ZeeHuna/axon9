<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Benjamin Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1510;--card:#13221A;--card2:#182B21;--line:#22362B;--cream:#EDE6D3;--mute:#8FA398;--dim:#5A6E62;--copper:#D0904F;--copper2:#F1B877;--blue:#3D7BE0;--up:#3DCB8A;--dn:#F06A57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
.up{color:var(--up)} .dn{color:var(--dn)}
.page{max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
/* top row */
.top{display:flex;align-items:center;justify-content:space-between;height:48px}
.acct{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px 6px 6px;font-weight:600;font-size:14px;color:var(--cream);cursor:pointer}
.acct img{width:26px;height:26px;border-radius:50%}
.icons{display:flex;gap:6px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--cream);cursor:pointer;position:relative}
.ib .badge{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--copper);box-shadow:0 0 0 2px var(--card)}
/* balance card */
.bal{margin-top:10px;border-radius:22px;padding:20px 18px 18px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,rgba(208,144,79,.22),transparent 55%),linear-gradient(160deg,#1F3B2D,#13261C 70%)}
.bal .wm{position:absolute;right:-30px;top:-20px;width:190px;height:190px;border-radius:50%;opacity:.13;filter:grayscale(.3)}
.bal .tags{display:flex;gap:6px}
.tg{font-size:11px;font-weight:600;letter-spacing:.04em;padding:4px 9px;border-radius:7px;background:rgba(237,230,211,.1);color:var(--cream)}
.tg.c{background:rgba(208,144,79,.2);color:var(--copper2)}
.bal .lb{margin-top:16px;font-size:12px;color:var(--mute)}
.bal .big{font-size:40px;font-weight:700;letter-spacing:-.01em;margin-top:2px;position:relative}
.bal .big small{font-size:22px;font-weight:600}
.bal .today{display:inline-flex;margin-top:6px;font:500 13px 'JetBrains Mono',monospace;padding:4px 9px;border-radius:7px;background:rgba(0,0,0,.22)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{height:48px;border-radius:99px;border:0;font:600 15px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.w{background:var(--cream);color:#0B1510}
.btn.o{background:linear-gradient(145deg,var(--copper2),var(--copper));color:#1A110A}
.btn.off{background:rgba(237,230,211,.1);color:var(--cream);border:1px solid rgba(237,230,211,.2)}
.dotlive{width:8px;height:8px;border-radius:50%;background:#1A110A;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.3}}
/* shortcuts */
.short{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:20px}
.sc{background:none;border:0;color:var(--cream);display:flex;flex-direction:column;align-items:center;gap:8px;font:500 12px Inter,sans-serif;cursor:pointer;padding:0}
.sc span{width:56px;height:56px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
/* benjamin says banner */
.says{margin-top:20px;border-radius:18px;padding:16px 16px 16px 18px;display:grid;grid-template-columns:1fr 64px;gap:12px;align-items:center;cursor:pointer;
  background:linear-gradient(120deg,#B8743A,#D0904F 45%,#E9AB66);color:#1A110A;position:relative;overflow:hidden}
.says::after{content:'';position:absolute;inset:0;background:repeating-radial-gradient(circle at 110% 50%,rgba(255,255,255,.08) 0 2px,transparent 2px 9px);pointer-events:none}
.says b{font-size:16px;display:block}
.says p{margin:6px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:17px;line-height:1.35}
.says img{width:64px;height:64px;border-radius:50%;box-shadow:0 6px 18px rgba(0,0,0,.3);position:relative;z-index:1}
/* sections */
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px}
.sh h2{margin:0;font-size:20px;font-weight:700}
.sh button{background:none;border:0;color:var(--copper2);font:600 13px Inter,sans-serif;cursor:pointer}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.mc{flex:0 0 72%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;color:var(--cream);text-align:left;font-family:Inter,sans-serif}
.mc .h{display:flex;align-items:center;gap:10px}
.mc .lg{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.mc .lg.au{background:linear-gradient(145deg,#F5D27A,#B8862C);color:#2A1E05}
.mc .lg.bt{background:linear-gradient(145deg,#FFB547,#E8860C);color:#2A1702}
.mc .nm b{display:block;font-size:15px}.mc .nm small{color:var(--mute);font-size:12px}
.mc .px{margin-top:12px;display:flex;align-items:baseline;gap:10px}
.mc .px b{font-size:20px;font-weight:700}
.mc .px span{font-size:13px;font-weight:600}
.mc svg{display:block;width:100%;height:60px;margin-top:8px}
.mc .bj{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.pill{font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px}
.pill.buy{background:rgba(61,203,138,.15);color:var(--up)}.pill.sell{background:rgba(240,106,87,.15);color:var(--dn)}.pill.wait{background:rgba(237,230,211,.08);color:var(--mute)}
/* trades */
.tc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.tc .r{display:flex;justify-content:space-between;align-items:center}
.tc b{font-size:15px}
.tc .s{font-size:12px;color:var(--mute);margin-top:6px;font-family:'JetBrains Mono',monospace}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:18px;color:var(--mute);font-size:14px;text-align:center}
/* decisions list */
.ds{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.di{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:14px;border-top:1px solid var(--line)}
.di:first-child{border-top:0}
.di .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ic.trade{background:rgba(208,144,79,.16);color:var(--copper2)}.ic.win{background:rgba(61,203,138,.14);color:var(--up)}.ic.loss{background:rgba(240,106,87,.14);color:var(--dn)}
.ic.guard{background:rgba(61,123,224,.16);color:#8DB2F5}.ic.sys,.ic.skip{background:rgba(237,230,211,.07);color:var(--mute)}
.di .src{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mute)}
.di .src span{font-weight:500;letter-spacing:0;margin-left:6px}
.di p{margin:4px 0 0;font-size:14px;line-height:1.45}
/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(11,21,16,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;color:var(--dim);font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 10px;cursor:pointer;position:relative}
nav button.on{color:var(--copper2)}
nav button.on::before{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--copper)}
nav .ai{width:44px;height:44px;margin-top:-22px;border-radius:50%;background:linear-gradient(145deg,var(--copper2),var(--copper));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(208,144,79,.4)}
nav .ai img{width:38px;height:38px;border-radius:50%}
/* markets list */
.ml{margin-top:6px}
.mr{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--cream);text-align:left;cursor:pointer;font-family:Inter,sans-serif}
.mr .lg{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.mr .lg.au{background:linear-gradient(145deg,#F5D27A,#B8862C);color:#2A1E05}.mr .lg.bt{background:linear-gradient(145deg,#FFB547,#E8860C);color:#2A1702}
.mr b{display:block;font-size:16px}.mr small{display:block;color:var(--mute);font-size:13px;margin-top:3px}
.mr .rt{text-align:right}.mr .rt small.up{color:var(--up)}.mr .rt small.dn{color:var(--dn)}.mr .rt b{font-family:'JetBrains Mono',monospace;font-weight:500}.mr .rt small{font-weight:600}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.dh .l{display:flex;align-items:center;gap:10px}
.dh .lg{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.dh .lg.au{background:linear-gradient(145deg,#F5D27A,#B8862C);color:#2A1E05}.dh .lg.bt{background:linear-gradient(145deg,#FFB547,#E8860C);color:#2A1702}
.dh b{font-size:18px;display:block}.dh small{font-size:12px;font-weight:600}
.chartbox{margin:12px -16px 0;padding:6px 6px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0D1913}
.chartbox svg{width:100%;height:auto;display:block}
.tfs{display:flex;gap:8px;padding:12px 0}
.tfs button{min-width:52px;height:36px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--mute);font:600 13px Inter,sans-serif;cursor:pointer}
.tfs button.on{background:var(--cream);color:#0B1510;border-color:var(--cream)}
.ba{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:0;margin-top:4px}
.ba div{border-radius:14px;padding:10px 12px;text-align:center}
.ba .s{background:rgba(240,106,87,.12);border:1px solid rgba(240,106,87,.3)}.ba .bu{background:rgba(61,203,138,.12);border:1px solid rgba(61,203,138,.3)}
.ba small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mute)}
.ba b{font:500 16px 'JetBrains Mono',monospace}
.ba .sp{margin:0 -8px;z-index:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 7px;font:600 11px 'JetBrains Mono',monospace;color:var(--mute)}
.aio{margin-top:14px;border-radius:18px;padding:16px;background:linear-gradient(150deg,#1D3428,#14261C);border:1px solid #2A4234}
.aio .t{display:flex;justify-content:space-between;align-items:center}
.aio .t b{display:flex;align-items:center;gap:8px;font-size:16px}
.aio .t img{width:26px;height:26px;border-radius:50%}
.aio p{margin:12px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:19px;line-height:1.4}
.aio .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.aio .chips span{font-size:12px;font-weight:600;padding:5px 9px;border-radius:99px;background:rgba(0,0,0,.25);color:var(--mute)}
.aio .chips span.g{color:var(--up)}.aio .chips span.r{color:var(--dn)}
.dtabs{display:flex;gap:8px;margin-top:18px}
.dtabs button{height:38px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--mute);font:600 13px Inter,sans-serif;cursor:pointer}
.dtabs button.on{background:var(--cream);color:#0B1510;border-color:var(--cream)}
.lvl{display:flex;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line);font-size:15px}
.lvl span:first-child{display:flex;align-items:center;gap:10px}
.lvl i{width:10px;height:10px;border-radius:3px}
.lvl b{font:500 15px 'JetBrains Mono',monospace}
.ev{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);font-size:14px}
.ev time{font:500 12px 'JetBrains Mono',monospace;color:var(--mute)}
.ev .im{display:flex;gap:2px}.ev .im i{width:5px;height:14px;border-radius:2px;background:#2A3E33}.ev .im i.on{background:var(--copper)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--copper2);font:600 14px Inter,sans-serif;padding:14px 0 0;cursor:pointer}
/* other tabs */
h1{font-size:26px;margin:14px 0 4px}
.lead{color:var(--mute);font-size:14px;margin:0 0 14px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:99px;border:0;background:none;color:var(--mute);font:600 14px Inter,sans-serif;cursor:pointer}
.seg button.on{background:var(--cream);color:#0B1510}
.big-chart{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}
.big-chart svg{width:100%;height:auto;display:block}
.think{margin-top:14px;background:var(--card2);border-radius:16px;padding:14px 16px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:19px;line-height:1.4}
.qs{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;color:var(--cream);font:500 15px Inter,sans-serif;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.q.on{border-color:var(--copper)}
.bub{display:grid;grid-template-columns:36px 1fr;gap:10px;margin-top:16px}
.bub img{width:36px;height:36px;border-radius:50%}
.bub div{background:var(--card2);border-radius:4px 16px 16px 16px;padding:14px;font-size:15px;line-height:1.5}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;font-size:15px}
.row small{color:var(--mute)}
.ghost{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--cream);font:600 15px Inter,sans-serif;cursor:pointer;margin-top:10px}
.ghost.warn{color:var(--dn)}
/* setup */
.setup{text-align:center;padding-top:40px}
.setup img{width:190px;max-width:60%;border-radius:18px}
.setup h1{font-family:'Cormorant Garamond',serif;font-size:30px;margin:24px 0 6px}
.setup p{color:var(--mute);font-size:14px;line-height:1.55;margin:0}
.setup input{margin-top:24px;width:100%;height:60px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--cream);font:500 21px 'JetBrains Mono',monospace;text-align:center;letter-spacing:.12em;text-transform:uppercase}
.setup input:focus{outline:2px solid var(--copper);outline-offset:2px}
.setup .btn{width:100%;margin-top:14px;height:56px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:12px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page" id="app"></div>
<nav id="nav" hidden><div class="in">
  <button data-tab="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="markets"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Markets</button>
  <button data-tab="ask"><span class="ai"><img src="icon.png" alt=""></span>Benjamin</button>
  <button data-tab="trades"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/></svg>Trades</button>
  <button data-tab="more"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>More</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var DB = 'https://axon9-7309e-default-rtdb.europe-west1.firebasedatabase.app';
  var key = localStorage.getItem('bp_key') || '', S = null, busy = false, last = '', tab = 'home', mkSel = 0, ask = '', mkOpen = false, tf = 'c', dtab = 'ai';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(function () { e.classList.remove('show'); }, 2800); }
  function fmt(v, d) { return Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function cs() { return (S && S.cs) || ''; }
  function money(v) { v = Number(v || 0); return (v < 0 ? '−' : '+') + cs() + fmt(Math.abs(v), 2); }
  function hhmm(t) { var d = new Date(t * 1000); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function path(c) { c = c.toLowerCase(); return DB + '/axon/' + c + c + 'bpbp'; }
  function base() { return path(key); }
  function kind(m) {
    if (/^(BUY|SELL) /.test(m)) return 'trade';
    if (/^Closed .*: \+/.test(m) || /banked/.test(m)) return 'win';
    if (/^Closed .*: [−-]/.test(m)) return 'loss';
    if (/breakeven|trailing|stop hit|paus|loss stop|no stop|REJECTED|calendar/i.test(m)) return 'guard';
    if (/^Skipped/.test(m)) return 'skip';
    return 'sys';
  }
  var KIND_LABEL = { trade: 'TRADE', win: 'PROFIT', loss: 'LOSS', guard: 'PROTECTION', skip: 'SKIPPED', sys: 'BENJAMIN' };
  var ICO = {
    trade: '<path d="M4 17l5-5 4 4 7-8M15 8h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
    win: '<path d="M5 12l4 4 10-10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    loss: '<path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
    guard: '<path d="M12 3l7 3v6c0 4-3 7.5-7 9-4-1.5-7-5-7-9V6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    skip: '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    sys: '<circle cx="12" cy="12" r="3.5" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/>'
  };
  function svgI(k) { return '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">' + ICO[k] + '</svg>'; }

  /* Benjamin's one-line voice, from live data */
  function voice() {
    if (!S) return '';
    var live = (Date.now() / 1000 - S.t) < 60;

    var b = e.target.closest('button,[data-tab]'); if (!b) return;
    if (b.dataset.tab) { tab = b.dataset.tab; mkOpen = false; window.scrollTo(0, 0); render(true); return; }
    if (b.dataset.mk != null) { mkSel = +b.dataset.mk; tab = 'markets'; mkOpen = true; window.scrollTo(0, 0); render(true); return; }
    if (b.id === 'mkback') { mkOpen = false; render(true); return; }
    if (b.dataset.tf) { tf = b.dataset.tf; render(true); return; }
    if (b.dataset.dt) { dtab = b.dataset.dt; render(true); return; }
    if (b.dataset.mk2 != null) { mkSel = +b.dataset.mk2; render(true); return; }
    if (b.dataset.ask) { ask = b.dataset.ask; render(true); return; }
    if (b.id === 'link') {
      var c = ($('code').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (c.length !== 12) { toast('The code has 12 letters and numbers'); return; }
      toast('Connecting…');
      fetch(path(c) + '/bp.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
        if (!d || !d.t) { toast('Not found yet – Benjamin posts every 10s. Try again.'); return; }
        key = c; S = d; localStorage.setItem('bp_key', key); tab = 'home'; render(true); toast('Connected · #' + d.login);
      }).catch(function () { toast('No internet – try again'); });
    }
    if (b.id === 'sw' && S) {
      var on = !S.on; S.on = on; S.status = on ? 'Watching' : 'OFF'; render(true);
      if (navigator.vibrate) navigator.vibrate(12);
      send({ on: on }, on ? 'Benjamin is switching ON' : 'Benjamin is switching OFF – open trades still protected');
    }
    if (b.id === 'closeall') {
      if (b.dataset.sure) send({ on: S.on, close: true }, 'Closing all trades…');
      else { b.dataset.sure = '1'; b.textContent = 'Tap again to confirm'; setTimeout(function () { if (b.isConnected) { delete b.dataset.sure; b.textContent = 'Close all trades'; } }, 4000); }
    }
    if (b.id === 'unlink') { localStorage.removeItem('bp_key'); key = ''; S = null; tab = 'home'; render(true); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'code') return;
    var c = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
    e.target.value = c.replace(/(.{4})(?=.)/g, '$1-');
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'code') $('link').click(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  render(true); load();
  setInterval(function () { if (!document.hidden) load(); }, 5000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
