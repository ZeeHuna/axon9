<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0716">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AXON-9">
<title>AXON-9</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#0D0716; --surface:#1A1029; --surface2:#22163A; --line:#33204F; --line2:#4A3270;
  --text:#F4F1FA; --muted:#A99BC4; --gold:#FFC62F; --gold2:#FFE08A; --purple:#4F2683; --purple2:#8F6AD0;
  --buy:#3DDC97; --buyBg:#123323; --sell:#FF8A5B; --sellBg:#3A1E12; --warn:#FFC62F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none}
.mono{font-family:'JetBrains Mono',monospace}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg),rgba(13,7,22,.92));padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.badge{width:38px;height:38px;border-radius:10px;background:var(--purple);border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:800;font-size:13px}
.brand h1{margin:0;font-family:'Orbitron',sans-serif;font-size:18px;letter-spacing:.04em}
.brand small{display:block;color:var(--muted);font-size:11px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:99px;background:currentColor;display:block}
.pill.live{color:var(--buy);background:#10281C}
.pill.off{color:var(--sell);background:var(--sellBg)}
main{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.big{font-size:24px;font-weight:700}
.up{color:var(--buy)} .down{color:var(--sell)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:14px;padding:4px}
.seg button{height:44px;border-radius:11px;font-weight:700;font-size:14px;background:transparent;color:var(--muted)}
.seg button.on{background:var(--gold);color:#1A0F2E}
.toggle{width:64px;height:38px;border-radius:99px;padding:3px;background:var(--line2);display:flex;align-items:center;transition:.2s}
.toggle span{width:32px;height:32px;border-radius:99px;background:#fff;display:block;transition:.2s}
.toggle.on{background:var(--gold);justify-content:flex-end}
.btn{height:46px;border-radius:12px;font-weight:700;font-size:14px;padding:0 14px}
.btn.gold{background:var(--gold);color:#1A0F2E}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.danger{background:transparent;border:1px solid var(--sell);color:var(--sell)}
.btn.full{width:100%}
.mkt{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.mkt:last-child{border-bottom:none}
button.mkt{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;cursor:pointer}
button.mkt:active{background:var(--surface2)}
.chev{color:var(--muted);font-size:18px;margin-left:6px}
.px2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.px2 div{background:var(--surface2);border-radius:10px;padding:10px}
.px2 span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.px2 b{font-family:'JetBrains Mono',monospace;font-size:18px}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn.buy{background:#1F7A4D;color:#fff}.btn.sell{background:#B3263E;color:#fff}
.acct{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.tag.trend{background:#2E1A4A;color:var(--gold)}
.meter{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--purple2),var(--gold));border-radius:99px}
.state{font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 9px;border-radius:99px;background:#2E1A4A;color:var(--gold)}
.state.bad{background:#4A1A22;color:#FF8A8A} .state.warn{background:#3A2E12;color:#FFD36B}
.tag.buy{background:var(--buyBg);color:var(--buy)} .tag.sell{background:var(--sellBg);color:var(--sell)}
.tag.hold{background:#2E1A4A;color:var(--gold)} .tag.scalp{background:#1B2A3A;color:#8FD3FF}
.why{font-size:12px;color:var(--muted)}
.lv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px 0}
.lv div{background:var(--bg);border-radius:10px;padding:8px}
.lv b{display:block;font-family:'JetBrains Mono',monospace;font-size:13px}
.lv span{font-size:10px;color:var(--muted)}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.counts button{min-width:44px;height:44px;border-radius:10px;background:var(--surface2);color:var(--text);font-weight:700}
.counts button:hover{background:var(--purple)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:#120A1F;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;padding:6px 0;min-height:48px}
nav button.on{color:var(--gold)}
nav svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--gold);color:#1A0F2E;font-weight:700;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.banner{background:var(--sellBg);border:1px solid #6A3420;color:#FFC2A8;border-radius:14px;padding:12px;font-size:13px}
.setup input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--text);padding:0 12px;font-size:14px;font-family:'JetBrains Mono',monospace}
.setup label{font-size:12px;color:var(--muted);display:block;margin:12px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:40px;padding:0 14px;border-radius:10px;background:var(--surface2);color:var(--text);font-weight:600;font-family:'JetBrains Mono',monospace}
.chips button.on{background:var(--gold);color:#1A0F2E}
.last{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:12px;padding-top:10px}

/* v3.4.1 onboarding + accounts */
body.bare{padding-bottom:24px} body.bare nav{display:none}
.hero{text-align:center;padding:26px 8px 6px}
.logo{width:84px;height:84px;margin:0 auto 16px;border-radius:24px;background:radial-gradient(120% 120% at 30% 20%,#7B4CC4,var(--purple) 55%,#2A1250);border:2px solid var(--gold);display:grid;place-items:center;font-family:'Orbitron',sans-serif;font-weight:800;font-size:28px;color:var(--gold);box-shadow:0 18px 50px -12px rgba(143,106,208,.6)}
.hero h2{font-family:'Orbitron',sans-serif;margin:0;font-size:24px;letter-spacing:.05em}
.hero p{color:var(--muted);margin:8px 0 0;font-size:14px;line-height:1.5}
.field{position:relative;margin-top:14px}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.field input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:var(--text);padding:0 14px;font-size:16px;font-family:inherit;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--gold)}
.eye{position:absolute;right:6px;bottom:6px;height:40px;padding:0 12px;border-radius:10px;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700}
.btn.lg{height:54px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.55}
.link{background:none;color:var(--gold2);font-weight:600;font-size:14px;padding:10px;display:block;margin:6px auto 0}
.trust{display:flex;justify-content:center;gap:16px;color:var(--muted);font-size:12px;margin-top:6px;flex-wrap:wrap}
.trust span::before{content:'●';color:var(--buy);margin-right:6px;font-size:9px;vertical-align:2px}
.acard{width:100%;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:inherit;text-align:left;font:inherit}
.acard.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.av{width:48px;height:48px;border-radius:14px;background:#2E1A4A;color:var(--gold);font-weight:800;font-size:16px;display:grid;place-items:center;position:relative}
.av i{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:99px;border:3px solid var(--surface);background:var(--line2)}
.av i.live{background:var(--buy)} .av i.off{background:var(--sell)}
.acard b{font-size:16px}
.acard .eq{font-family:'JetBrains Mono',monospace;font-size:14px;text-align:right}
.more{width:40px;height:40px;border-radius:12px;background:var(--surface2);color:var(--muted);font-size:18px;font-weight:800}
.amenu{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:-4px}
.add{width:100%;height:64px;border-radius:18px;border:1.5px dashed var(--line2);background:transparent;color:var(--gold);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.add span{width:30px;height:30px;border-radius:99px;background:var(--gold);color:#1A0F2E;display:grid;place-items:center;font-size:20px;line-height:1}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 2px}
.prog i{height:4px;border-radius:99px;background:var(--line)} .prog i.on{background:var(--gold)}
.step{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.wh{font-size:22px;font-weight:700;margin:6px 0 4px}
.brokers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.brokers button{height:64px;border-radius:14px;background:var(--surface2);color:var(--text);font-weight:700;font-size:15px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.brokers button small{color:var(--muted);font-weight:500;font-size:11px}
.brokers button.on{border-color:var(--gold);background:#2E1A4A}
.chk{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:10px;counter-reset:c}
.chk li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.45}
.chk li::before{counter-increment:c;content:counter(c);width:30px;height:30px;border-radius:99px;background:var(--surface2);color:var(--gold);font-weight:800;display:grid;place-items:center}
.chk code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);padding:2px 6px;border-radius:6px;word-break:break-all}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.dl a{display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;background:var(--surface2);color:var(--text);font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--line2)}
.code{width:100%;height:60px;border-radius:16px;border:1.5px solid var(--line2);background:var(--bg);color:var(--gold);text-align:center;font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.14em;font-weight:500;text-transform:uppercase;outline:none;margin-top:14px}
.code:focus{border-color:var(--gold)}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border-radius:14px;padding:12px;margin-top:12px;font-size:13px;color:var(--muted);line-height:1.45}
.hint b{color:var(--text)}
.copy{background:none;color:var(--gold2);font-weight:700;font-size:12px;padding:0 0 0 6px}

/* v3.4.2 approval sheet, lot stepper, MT5 button */
.sheetbg{position:fixed;inset:0;background:rgba(5,2,10,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease-out;box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}} @keyframes fade{from{opacity:0}}
.ring{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--gold)}
.ring i{width:10px;height:10px;border-radius:99px;background:var(--gold);box-shadow:0 0 0 0 rgba(255,198,47,.6);animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(255,198,47,0)}100%{box-shadow:0 0 0 0 rgba(255,198,47,0)}}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center;margin-top:8px}
.stepper button{height:52px;border-radius:14px;background:var(--surface2);color:var(--text);font-size:24px;font-weight:700}
.stepper div{height:52px;border-radius:14px;background:var(--bg);border:1px solid var(--line2);display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;color:var(--gold)}
.riskbar{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:13px;color:var(--muted)}
.riskbar.hot{background:#3A1E12;color:#FFC2A8}
.riskbar b{color:var(--text)}
.mt5{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:14px;background:#0F2236;border:1px solid #23466B;color:#8FD3FF;font-weight:700;font-size:15px;text-decoration:none}
.mt5 svg{width:20px;height:20px}
.bsearch{width:100%;height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:var(--text);padding:0 14px;font-size:16px;margin-top:14px;font-family:inherit;outline:none}

/* v3.4.3 chart reader */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:180px;border:1.5px dashed var(--line2);border-radius:18px;background:var(--bg);color:var(--muted);text-align:center;padding:16px;cursor:pointer}
.drop b{color:var(--gold);font-size:16px}
.drop img{max-width:100%;max-height:320px;border-radius:12px}
.verdict{border-radius:18px;padding:18px;background:linear-gradient(135deg,#2E1A4A,#1A1029);border:1px solid var(--line2)}
.verdict .plan{font-family:'Orbitron',sans-serif;font-size:30px;font-weight:800;letter-spacing:.04em}
.verdict .plan.SCALP{color:#8FD3FF} .verdict .plan.HOLD{color:var(--gold)} .verdict .plan.WAIT{color:var(--muted)}
.conf{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:6px}
.conf i{display:block;height:100%;background:linear-gradient(90deg,var(--purple2),var(--gold))}
.ul{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.5}
.spin{width:28px;height:28px;border-radius:99px;border:3px solid var(--line2);border-top-color:var(--gold);animation:sp 0.8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.rbtn{display:flex;align-items:center;justify-content:center;gap:8px}

/* v3.4.3 activity feed + all MT5 markets */
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4}
.fi:last-child{border-bottom:none}
.fi .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px;background:var(--surface2)}
.fi .ic.open{background:var(--buyBg)} .fi .ic.close{background:#2E1A4A} .fi .ic.block{background:var(--sellBg)} .fi .ic.sig{background:#1B2A3A}
.fi time{color:var(--muted);font-size:11px;white-space:nowrap}
.cats{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;scrollbar-width:none}
.cats button{height:36px;padding:0 14px;border-radius:99px;background:var(--surface2);color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
.cats button.on{background:var(--gold);color:#1A0F2E}
.wrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;padding:12px 0;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left}
.wrow:last-child{border-bottom:none}
.wrow b{font-size:15px} .wrow .mono{font-size:13px}
.chg{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;min-width:64px;text-align:center}
.chg.up{background:var(--buyBg)} .chg.down{background:var(--sellBg)}
.tag.app{background:#1B2A3A;color:#8FD3FF} .tag.auto{background:#2E1A4A;color:var(--gold)} .tag.man{background:var(--surface2);color:var(--muted)}

/* v3.4.5 bot reply card */
.reply{position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:4;background:linear-gradient(135deg,#2E1A4A,#22163A);border:1px solid var(--gold);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:up .25s ease-out}
.reply .label{color:var(--gold)} .reply p{margin:4px 0 0;font-size:14px;line-height:1.45;white-space:pre-line;max-height:40vh;overflow:auto}
.reply button{background:none;color:var(--muted);font-size:20px;align-self:start;padding:0 4px}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="badge">A9</div><div><h1>AXON-9</h1><small id="sub">connecting…</small></div></div>
  <div id="live" class="pill"><i></i><span>…</span></div>
</header>
<main id="view"></main>
<nav>
  <button data-tab="home" class="on" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg>Home</button>

    if (b.dataset.n) { nSel = Number(b.dataset.n); render(); return; }
    var mn = e.target.closest('[data-menu]');
    if (mn) { var mi = Number(mn.dataset.menu); menuOpen = menuOpen === mi ? -1 : mi; render(); return; }
    if (b.dataset.acct !== undefined) { var x = accts()[Number(b.dataset.acct)]; if (x) { if (x.k !== KEY) { pick(x); load(); } menuOpen = -1; tab = 'home'; setNav(); render(); window.scrollTo(0, 0); } return; }
    if (b.dataset.rename !== undefined) { var aa = accts(), y = aa[Number(b.dataset.rename)]; if (y) { var nm = prompt('Name for this account (e.g. Zola 1, Suzan 2):', y.name || ''); if (nm !== null) { y.name = nm.trim().slice(0, 20); saveAccts(aa); render(); } } return; }
    if (b.dataset.delacct !== undefined) { var ab = accts(), z = ab[Number(b.dataset.delacct)]; if (z && confirm('Remove ' + (z.name || 'this account') + ' from this phone? (the bot keeps running)')) { ab.splice(Number(b.dataset.delacct), 1); saveAccts(ab); if (z.k === KEY) { pick(ab[0]); load(); } tab = KEY ? 'accts' : 'home'; render(); } return; }
    if (b.dataset.cmd) {
      if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
      picking = null;
      send(b.dataset.cmd, b.dataset.msg);
    }
  });
  function setNav() { document.querySelectorAll('nav button').forEach(function (n) { n.classList.toggle('on', n.dataset.tab === tab); }); }
  document.querySelector('header .brand').addEventListener('click', function () { if (U && KEY) { tab = tab === 'accts' ? 'home' : 'accts'; menuOpen = -1; if (tab === 'accts') peekAll(); setNav(); render(); window.scrollTo(0, 0); } });
  document.addEventListener('click', function (e) { if (e.target.classList && e.target.classList.contains('sheetbg')) { ask = null; render(); } });
  document.addEventListener('click', function () { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }, { once: true });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'rfile') pickImage(e.target.files && e.target.files[0]);
    if (e.target.id === 'lotin') { var v = Number(String(e.target.value).replace(',', '.')); if (v > 0) { lotSel = Math.round(v * 100) / 100; e.target.blur(); render(true); } }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'rnote') { rd.note = e.target.value; return; }
    if (e.target.id === 'em') { store.set('axlastemail', e.target.value.trim()); return; }   // pairing code: auto-format ABCD-2345
    if (e.target.id === 'bq') { bq = e.target.value; var qq = bq.toLowerCase().trim(); document.querySelectorAll('[data-broker]').forEach(function (x) { x.style.display = !qq || x.dataset.broker === 'Other' || x.dataset.broker.toLowerCase().indexOf(qq) >= 0 ? '' : 'none'; }); return; }
    if (e.target.id === 'an') { wiz.name = e.target.value; return; }
    if (e.target.id !== 'pc') return;
    var c = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    e.target.value = c.length > 4 ? c.slice(0, 4) + '-' + c.slice(4) : c; wiz.code = e.target.value;
  });

  document.querySelector('header .brand').style.cursor = 'pointer';

  setInterval(load, 3000);
