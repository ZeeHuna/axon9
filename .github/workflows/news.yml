name: AXON-9 news
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/news.py
      - run: |
          git config user.name "axon9-news"
          git config user.email "axon9-news@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "news update" && git push)
